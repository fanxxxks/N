# R1 engineering calibration configuration (NOT a research run; AGENTS §4.1).
# Purpose: measure per-evaluation wall cost of the protocol arms in the
# medium domain on fold 0 so the preregistered R1 budget has a real
# wall-clock projection. Tiny budget; results support budget sizing only
# and must never be cited as research evidence.
# No secrets in this file (TUSHARE_TOKEN lives in git-ignored config/.env).

data_dir: D:/minequant/AlphaGPT-r1/data
duckdb_path: D:/minequant/AlphaGPT/data/ashare.duckdb
parquet_dir: D:/minequant/AlphaGPT-r1/data/parquet
v2_duckdb_path: D:/minequant/AlphaGPT-d2/data/ashare_v2.duckdb

calendar_table: trade_calendar
stocks_table: stocks
daily_table: daily_bar
constituents_table: constituents

start_date: "2015-01-01"
end_date: "2026-12-31"
adjust: qfq

index_codes:
  - "000300.SH"
  - "000905.SH"

index_names:
  - "沪深300"
  - "中证500"

min_listed_sessions: 60

model:
  searcher: gp

# Domain mode: turnover_budget / cost_weight / baseline_signals omitted on
# purpose so the versioned domain registry defaults apply (p6 §3).
protocol:
  domain: medium_cross_section
  frequency: every_10_days
  horizon: 10
  seeds: [42]
  screening: {steps: 2, batch_size: 32}
  confirmation: {steps: 2, batch_size: 32}

backtest:
  start_date: "2015-01-01"
  end_date: "2026-12-31"
  train_end_date: "2023-12-31"
  initial_capital: 100000.0
  top_n: 20
  portfolio_method: equal_weight
  buy_rank: 20
  sell_rank: 30
  min_trade_amount: 5000.0
  target_weight_change_threshold: 0.01
  single_weight_cap: 0.05
  commission_rate: 0.00025
  min_commission: 5.0
  stamp_tax_rate: 0.0005
  transfer_fee_rate: 0.00001
  slippage_rate: 0.0005
  benchmark: "全市场等权"
