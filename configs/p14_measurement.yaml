# P14 formal measurement configuration (E4/t23).
# Points the loader at the production calendar/constituents database and
# the D3-backfilled v2 PIT store. No secrets in this file (TUSHARE_TOKEN
# lives in git-ignored config/.env only).

data_dir: D:/minequant/AlphaGPT/data
duckdb_path: D:/minequant/AlphaGPT/data/ashare.duckdb
parquet_dir: D:/minequant/AlphaGPT/data/parquet
v2_duckdb_path: D:/minequant/AlphaGPT-d2/data/ashare_v2.duckdb

calendar_table: trade_calendar
stocks_table: stocks
daily_table: daily_bar
constituents_table: constituents

start_date: "2015-01-01"
end_date: "2026-12-31"

index_codes:
  - "000300.SH"
  - "000905.SH"
index_names:
  - "沪深300"
  - "中证500"
min_listed_sessions: 60

model:
  d_model: 64
  nhead: 4
  num_layers: 2
  dim_feedforward: 128
  num_loops: 3
  dropout: 0.1

protocol:
  folds:
    - train_end: "20240628"
      test_end: "20241231"
